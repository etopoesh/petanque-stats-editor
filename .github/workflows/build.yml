name: Build Electron App for Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    # Запускаем полную сборку фронтенда и упаковку в Electron
    # Если скрипт "build" настроен на компиляцию всего проекта:
    - name: Build and Pack App
      run: npm run build
      
    # Если вы хотите вызвать упаковщик напрямую, можно использовать:
    # run: npx electron-builder --windows

    # Скачиваем готовый установщик из папки release, заданной в package.json
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: petanque-editor-setup
        path: release/*.exe
